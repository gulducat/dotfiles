# prefix-r (lower 'r') reload just this config.
# prefix-R (capital 'R') reloads the main conf.
bind r source-file ~/.config/tmux/bespoke.conf \; \
  display-message "bespoke tmux config reloaded!"

# prefix-b to toggle status bar
bind-key b set-option status

# tmux update started putting underlines on window titles
set-window-option -g window-status-current-style nounderscore

# pi coding agent wants this
set -g extended-keys on
set -g extended-keys-format csi-u

set -g pane-border-style 'fg=colour238' # grey
set -g pane-active-border-style 'fg=colour212' # light pink - #b25e96

