# https://starship.rs/config

# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
format = "$cmd_duration\n$jobs$time$git_branch$git_status$git_state$git_metrics$all$directory$character"
#format = """$character $fill $all"""
#[fill]
#symbol = ' '

# Replace the '❯' symbol in the prompt with '➜'
[character]
success_symbol = '[➜](bold green)'
error_symbol = '[➜](bold red)'

[time]
disabled = false
format = '[$time]($style) '
style = 'dimmed yellow'

[cmd_duration]
format = '🕙 took [$duration]($style)'

[jobs]
symbol = '&'

[git_metrics]
disabled = false

[git_status]
stashed = ""
untracked = ""

[git_branch]
format = ' [$symbol$branch(:$remote_branch)]($style) '
#truncation_length = 20

[nix_shell]
style = 'blue'

[package]
format = '[pkg=($version )]($style)'
style = 'dimmed 208'

[golang]
format = '[go=($version )]($style)'
style = 'dimmed dimmed cyan'

[nodejs]
format = '[js=($version )]($style)'
style = 'dimmed green'
not_capable_style = 'dimmed red'

[python]
format = '[py=($version )]($style)'
style = 'dimmed yellow'

[terraform]
format = '[tf=($version )]($style)'
style = 'dimmed purple'

[vagrant]
disabled = true
#symbol = "V"

[rust]
format = '[rs=($version )]($style)'
style = 'dimmed red'

[ruby]
format = '[rb=($version )]($style)'
style = 'dimmed red'
