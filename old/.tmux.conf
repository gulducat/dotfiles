bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

set -g mouse on

# prefix ctrl+a instead of ctrl+b
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# vim keys pane switching
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
# pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# start windows and panes at 1 instead of 0
#set -g base-index 1
setw -g pane-base-index 1

#set status-utf8 on
#set utf8 on
#set -g default-terminal "tmux-256color"
#set -g default-terminal "xterm-256color"
#set -g status-bg colour240
#set -g status-bg black
#set -g status-fg white
set -ga terminal-overrides ",xterm-256color:Tc"

# tmux plugin manager:
# https://github.com/tmux-plugins/tpm
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# C-a `I` to "Install" any changes
# themes: https://github.com/rothgar/awesome-tmux?tab=readme-ov-file#themes
# https://github.com/odedlaz/tmux-onedark-theme
#set -g @plugin 'odedlaz/tmux-onedark-theme'
# https://github.com/niksingh710/minimal-tmux-status/
set -g @plugin 'niksingh710/minimal-tmux-status'
set -g @minimal-tmux-status "top"
set -g @minimal-tmux-right false
set -g @minimal-tmux-left false
set -g @minimal-tmux-use-arrow true
set -g @minimal-tmux-right-arrow ""
set -g @minimal-tmux-left-arrow ""
# C-a `b` to toggle status bar
bind-key b set-option status

# init tpm -- run last
run '~/.tmux/plugins/tpm/tpm'

